<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>請求書・見積書システム</title>
  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: sans-serif; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script>
    // Reactが読み込まれたことを確認してからBabelでJSXを実行する
    window.addEventListener('load', function() {
      var script = document.createElement('script');
      script.type = 'text/babel';
      script.setAttribute('data-presets', 'react');
      fetch('./invoice-app.jsx')
        .then(r => r.text())
        .then(code => {
          var appScript = document.createElement('script');
          appScript.type = 'text/babel';
          appScript.setAttribute('data-presets', 'react');
          appScript.textContent = code + '\n\nReactDOM.createRoot(document.getElementById("root")).render(React.createElement(App));';
          document.body.appendChild(appScript);
          Babel.transformScriptTags();
        });
    });
  </script>
</body>
</html>
